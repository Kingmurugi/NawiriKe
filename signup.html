<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="signup.js" defer></script>
<script>
function toggleAdminCode() {
    const roleSelect = document.getElementById('role-select');
    const adminCodeField = document.getElementById('admin-code-field');
    const contactField = document.getElementById('contact-field');
    
    if (roleSelect.value === 'admin') {
        adminCodeField.style.display = 'block';
        document.getElementById('admin-code').required = true;
        contactField.style.display = 'none';
        document.getElementById('contact-input').required = false;
        document.getElementById('contact-input').value = '';
    } else if (roleSelect.value === 'donor') {
        adminCodeField.style.display = 'none';
        document.getElementById('admin-code').required = false;
        document.getElementById('admin-code').value = '';
        contactField.style.display = 'block';
        document.getElementById('contact-input').required = true;
    } else {
        adminCodeField.style.display = 'none';
        document.getElementById('admin-code').required = false;
        document.getElementById('admin-code').value = '';
        contactField.style.display = 'none';
        document.getElementById('contact-input').required = false;
        document.getElementById('contact-input').value = '';
    }
}
</script>
</head>
<body>
  <div class="wrapper">
    <h1>Signup</h1>
    <p id="error-message"></p>
    <form id="form">
      <div>
        <label for="firstname-input">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"><path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"/></svg>
        </label>
        <input type="text" name="firstname" id="firstname-input" placeholder="Firstname">
      </div>
      <div>
        <label for="email-input">
          <span>@</span>
        </label>
        <input type="email" name="email" id="email-input" placeholder="Email">
      </div>
      <div id="contact-field" style="display: none;">
        <label for="contact-input">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"><path d="M280-120q-33 0-56.5-23.5T200-200v-520q0-33 23.5-56.5T280-800h80v-80h80v80h160v-80h80v80h80q33 0 56.5 23.5T760-720v520q0 33-23.5 56.5T680-120H280Zm0-80h400v-360H280v360Zm0-440h400v-40H280v40Zm0 0v-40 40Zm0 440v-360 360Z"/></svg>
        </label>
        <input type="tel" name="contact" id="contact-input" placeholder="Contact Number">
      </div>
      <div>
        <label for="password-input">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm240-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/></svg>
        </label>
        <input type="password" name="password" id="password-input" placeholder="Password">
      </div>
      <div>
        <label for="repeat-password-input">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm240-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/></svg>
        </label>
        <input type="password" name="repeat-password" id="repeat-password-input" placeholder="Repeat Password">
      </div>
      <div>
        <label for="role-select">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"><path d="M480-80q-33 0-56.5-23.5T400-160v-112q0-34 17.5-62.5T464-378q62-31 126-46.5T720-440q66 0 130 15.5T976-378q29 15 46.5 43.5T1040-272v112q0 33-23.5 56.5T960-80H480Zm0-80h480v-112q0-11-5.5-20.5T936-316q-54-27-109-40.5T720-370q-72 0-127 13.5T484-316q-13 7-18.5 16.5T460-272v112Zm240-200q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Zm0-80q33 0 56.5-23.5T800-520q0-33-23.5-56.5T720-600q-33 0-56.5 23.5T640-520q0 33 23.5 56.5T720-480ZM0-240v-112q0-33 23.5-56.5T80-400q17 0 34 4t33 12q-11 29-17 58.5T120-272v32H0Zm160-240q-33 0-56.5-23.5T80-560q0-33 23.5-56.5T160-640q33 0 56.5 23.5T240-560q0 33-23.5 56.5T160-480Zm80 240v-32q0-94 55-168.5T424-816q-11-22-15.5-46.5T404-912q0-33 23.5-56.5T480-992q33 0 56.5 23.5T560-912q0 21-4.5 45.5T536-816q74 31 129 105.5T720-480v32H240Z"/></svg>
        </label>
        <select name="role" id="role-select" required onchange="toggleAdminCode()">
          <option value="">Select Your Role</option>
          <option value="donor">Donor</option>
          <option value="victim">Victim </option>
          <option value="admin">Admin - System Administrator</option>
        </select>
      </div>
      <div id="admin-code-field" style="display: none;">
        <label for="admin-code">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"><path d="M280-80q-33 0-56.5-23.5T200-160v-400q0-33 23.5-56.5T280-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H280Zm0-80h400v-360H280v360Zm0-440h400v-40H280v40Zm0 0v-40 40Zm0 440v-360 360Z"/></svg>
        </label>
        <input type="text" name="admin_code" id="admin-code" placeholder="Enter admin code">
      </div>
      <button type="submit">Signup</button>
    </form>
    <p>Already have an Account? <a href="login.html">login</a> </p>
  </div>
</body>
</html>
